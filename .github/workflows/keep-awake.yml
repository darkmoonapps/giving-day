name: Keep awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ping /health when the window is open
        env:
          KEEPAWAKE_START: ${{ vars.KEEPAWAKE_START }}
          KEEPAWAKE_END: ${{ vars.KEEPAWAKE_END }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: node scripts/keep-awake.mjs
