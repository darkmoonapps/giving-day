# Deploy the web PWA to Cloudflare Pages on push to master (or workflow_dispatch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Edit Cloudflare Pages token
#   CLOUDFLARE_ACCOUNT_ID  Account that owns the Pages project
#
# Required repository variable for a working production API:
#   VITE_API_URL           Render API origin, no trailing slash
#                          (example: https://giving-day-api.onrender.com)
#                          Empty is allowed by Vite but bakes relative /api
#                          URLs; this workflow does not invent a default.
#
# Optional:
#   CLOUDFLARE_PAGES_PROJECT  Pages project name. Defaults to giving-day
#                             (https://giving-day.pages.dev) when unset.
#   VITE_SENTRY_DSN, SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT, SENTRY_URL
#
# Install Wrangler outside this pnpm workspace. wrangler-action infers pnpm
# from pnpm-lock.yaml and runs `pnpm add wrangler@4` at the root
# (ERR_PNPM_ADDING_TO_ROOT). Forcing packageManager: npm still runs
# `npm i wrangler@4` at the root, which fails against pnpm node_modules
# with "Cannot read properties of null (reading 'name')". A prefix install
# in $RUNNER_TEMP keeps both the install and any action fallback off the
# workspace. Pass --branch and --commit-hash because that directory is not
# a git checkout, so Wrangler cannot infer them. This workflow does not
# invent a default VITE_API_URL.
name: Deploy Web

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_URL: ${{ vars.SENTRY_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions.'
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID secret is missing. Add it under Settings → Secrets and variables → Actions.'
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve Cloudflare Pages project name
        id: pages
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          project="${CLOUDFLARE_PAGES_PROJECT:-giving-day}"
          if [ -z "${project}" ]; then
            echo '::error::CLOUDFLARE_PAGES_PROJECT resolved empty; set the repository variable or rely on the giving-day default.'
            exit 1
          fi
          echo "name=${project}" >> "${GITHUB_OUTPUT}"

      - name: Warn if production API URL is unset
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo '::warning::Repository variable VITE_API_URL is empty. The production web build will use relative /api URLs instead of the Render API origin. Set Settings → Secrets and variables → Actions → Variables → VITE_API_URL (no trailing slash).'
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @giving-day/web... build

      - name: Strip source maps from the Pages artifact
        run: find apps/web/dist -name '*.map' -delete

      - name: Install Wrangler outside the workspace
        run: |
          mkdir -p "${RUNNER_TEMP}/wrangler-cli"
          npm --prefix "${RUNNER_TEMP}/wrangler-cli" install wrangler@4

      # workingDirectory is not a git checkout, so Wrangler cannot infer
      # branch or commit. --branch keeps master deploys as production when
      # it matches the Pages production_branch. --commit-hash is dashboard
      # metadata. --commit-message is omitted: it does not affect
      # production vs preview, and interpolating it is unsafe
      # (quotes/newlines; missing on workflow_dispatch).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}/wrangler-cli
          packageManager: npm
          wranglerVersion: '4'
          command: pages deploy ${{ github.workspace }}/apps/web/dist --project-name=${{ steps.pages.outputs.name }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
