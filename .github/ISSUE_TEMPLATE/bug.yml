name: Bug report
description: Report a problem in Giving Day
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Use obviously fake data only. Do not include real names, phone
        numbers, addresses, or other personal information (ADR 0007).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reproduce the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - shared
        - ui
        - ci
        - docs
        - other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, or `pnpm`/`node` versions if relevant.
      placeholder: Chrome 129, Node 22, pnpm 10
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, or related PRs. Redact personal data.
